name: Build signed release APK

# يُشغَّل يدويًا فقط. يحتاج أربعة أسرار في Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# لا يطبع أي سر، ويعرض بصمة SHA-256 للشهادة لتقارنها ببصمة مفتاحك السابق قبل اعتبار الـ APK تحديثًا.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check that all signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing GitHub secret for: $v"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Add the secrets described in docs/RELEASE.md, then run again."; exit 1; }

      - name: Restore keystore (never printed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          IDEABRIDGE_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          IDEABRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IDEABRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IDEABRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleRelease; else gradle --no-daemon assembleRelease; fi

      - name: Verify package, signature and print certificate fingerprint
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Signed APK not found (unsigned build?)"; ls app/build/outputs/apk/release || true; exit 1; }
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -n1)
          "$AAPT" dump badging "$APK" | grep "^package:" | tee badging.txt
          grep -q "name='com.ideabridge.app'" badging.txt
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          if grep -qi "Android Debug" certs.txt; then echo "APK is debug-signed, not the release key"; exit 1; fi
          grep "SHA-256" certs.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: IdeaBridge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
