name: Build debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Guard - no signing files or secrets in repo
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12)$|keystore\.properties'; then
            echo "Signing material found in repository"; exit 1
          fi

      - name: Unit tests
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon testDebugUnitTest; else gradle --no-daemon testDebugUnitTest; fi

      - name: Assemble debug APK
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      - name: Verify applicationId
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -n1)
          "$AAPT" dump badging "$APK" | grep "^package:" | tee badging.txt
          grep -q "name='com.ideabridge.app'" badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IdeaBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # اختبارات Room الفعلية على محاكي (تتضمن اختبار بقاء البيانات بعد إغلاق قاعدة البيانات وإعادة فتحها).
  # مستقلة عن وظيفة build حتى لا يمنع تعطل المحاكي رفع الـ APK.
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: sh -c 'if [ -x ./gradlew ]; then ./gradlew --no-daemon connectedDebugAndroidTest; else gradle --no-daemon connectedDebugAndroidTest; fi'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
